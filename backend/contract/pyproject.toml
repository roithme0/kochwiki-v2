[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "kochwiki-contract"
version = "0.0.0"
description = "Shared Kochwiki recipe-presentation API models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.4,<2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kochwiki_contract = ["py.typed"]
