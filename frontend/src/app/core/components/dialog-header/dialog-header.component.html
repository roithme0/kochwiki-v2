<!-- not using mat-dialog-title as it caused style issues with its ::before -->
<div class="heading">
  <h2 class="title">{{ title() }}</h2>
  @if (subtitle()) {
    <div class="subtitle">{{ subtitle() }}</div>
  }
</div>
@if (showCloseButon() === true) {
  <mat-dialog-actions>
    <button
      mat-icon-button
      mat-dialog-close
      color="warn"
      [disabled]="closeDisabled()"
    >
      <mat-icon aria-hidden="false" aria-label="Schließen" fontIcon="close" />
    </button>
  </mat-dialog-actions>
}
