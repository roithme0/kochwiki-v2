<div
  class="image-preview"
  [class.square]="square()"
  [attr.aria-busy]="state().loadingImage() || state().busy()"
>
  @if (state().imagePreview(); as preview) {
    <img
      [src]="preview"
      alt="Bildvorschau"
      (error)="state().imageLoadFailed()"
    />
  } @else {
    <img [src]="placeholder()" alt="Kein Bild vorhanden" />
  }
  <div class="image-actions">
    <div class="image-feedback" [class.has-feedback]="feedback()">
      <p [attr.role]="state().imageError() ? 'alert' : 'status'">
        {{ feedback() }}
      </p>
      @if (state().imageAccessFailed()) {
        <button
          mat-button
          type="button"
          [disabled]="state().busy()"
          (click)="state().loadImagePreview()"
        >
          Bild erneut laden
        </button>
      }
      @if (state().invalidImageSelection()) {
        <button
          mat-button
          type="button"
          [disabled]="state().busy()"
          (click)="state().discardInvalidSelection()"
        >
          Ungültige Auswahl verwerfen
        </button>
      }
    </div>
    <div class="image-controls">
      @if (state().hasImage()) {
        <button
          mat-mini-fab
          type="button"
          aria-label="Bild entfernen"
          [disabled]="state().busy()"
          (click)="state().removeImage()"
        >
          <mat-icon aria-hidden="true" fontIcon="delete" />
        </button>
      }
      <button
        mat-mini-fab
        type="button"
        [attr.aria-label]="
          state().hasImage() ? 'Bild ersetzen' : 'Bild auswählen'
        "
        [disabled]="state().busy()"
        (click)="imageInput.click()"
      >
        <mat-icon
          aria-hidden="true"
          [fontIcon]="state().hasImage() ? 'edit' : 'add_photo_alternate'"
        />
      </button>
    </div>
  </div>
  <input
    #imageInput
    type="file"
    accept="image/png,.png"
    hidden
    [disabled]="state().busy()"
    (change)="state().selectImage(imageInput)"
  />
</div>
