<div
  class="image-preview"
  [class.square]="square()"
  [attr.aria-busy]="state().loadingImage() || state().busy()"
>
  @if (state().imagePreview(); as preview) {
    @for (attempt of [state().previewGeneration()]; track attempt) {
      <img
        [src]="preview"
        alt="Bildvorschau"
        (load)="state().imageLoaded(preview, attempt)"
        (error)="state().imageLoadFailed(preview, attempt)"
      />
    }
  } @else {
    <img [src]="placeholder()" alt="Kein Bild vorhanden" />
  }
  <div class="image-actions">
    @if (feedback(); as message) {
      <p
        class="image-feedback"
        [attr.role]="state().imageError() ? 'alert' : 'status'"
      >
        {{ message }}
      </p>
    }
    <div class="image-controls">
      @for (action of actions(); track action.id) {
        <button
          mat-mini-fab
          type="button"
          [attr.aria-label]="action.label"
          [matTooltip]="action.label"
          [disabled]="state().busy()"
          (click)="action.run(imageInput)"
        >
          <mat-icon aria-hidden="true" [fontIcon]="action.icon" />
        </button>
      }
    </div>
  </div>
  <input
    #imageInput
    type="file"
    accept="image/png,.png"
    hidden
    [disabled]="state().busy()"
    (change)="state().selectImage(imageInput)"
  />
</div>
