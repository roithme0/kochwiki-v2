<mat-card>
  <mat-card-content class="legend-content">
    <div class="color-indicator" [style.--color]="legendElement().color"></div>
    <p class="display-name" [title]="legendElement().displayName">
      {{ legendElement().displayName }}
    </p>
    <div class="spacer"></div>
    @if (
      displayedValuePercentage() !== null &&
      displayedValuePercentage() !== undefined
    ) {
      <mat-card>
        <mat-card-content class="percentage-content">
          <p class="value-percentage">
            {{ displayedValuePercentage() }}&nbsp;%
          </p>
        </mat-card-content>
      </mat-card>
    }
    <p
      class="value-absolute"
      [attr.aria-label]="
        legendElement().value.status === 'unknown'
          ? legendElement().displayName + ': Angabe fehlt'
          : null
      "
    >
      {{ displayedValue() }}
    </p>
  </mat-card-content>
</mat-card>
