<mat-card>
  @if (showHeader()) {
    <mat-card-header>
      <mat-card-title>Nährwerte</mat-card-title>
      <mat-card-subtitle>{{ basis() }}</mat-card-subtitle>
    </mat-card-header>
  }
  <mat-card-content>
    <div class="nutrition-content">
      <app-macro-chart class="macro-chart" [nutrition]="nutrition()" />
      @if (showLegend()) {
        <div class="legend">
          @for (entry of nutrientLegend(); track entry.displayName) {
            <app-chart-legend-element [legendElement]="entry" />
          }
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
