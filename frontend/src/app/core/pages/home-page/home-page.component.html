<main>
  <h1 class="greeting">
    <app-text-reveal
      text="Schön,&#10;dass du da bist."
      [startDelay]="250"
      [animate]="animateGreeting"
    />
  </h1>
  <nav class="navigation">
    <a
      routerLink="/recipes"
      ariaCurrentWhenActive="page"
      class="navigation-link"
    >
      <img src="images/recipes.png" alt="" class="image" />
      <span class="navigation-label">Rezepte</span>
    </a>
    <a
      routerLink="/foodstuffs"
      ariaCurrentWhenActive="page"
      class="navigation-link"
    >
      <img src="images/foodstuffs.png" alt="" class="image" />
      <span class="navigation-label">Zutaten</span>
    </a>
  </nav>
  <div class="versions-wrapper">
    <span class="version">Frontend {{ frontendVersion }}</span>
    @if (backendMetaService.backendVersion()) {
      <span class="version"
        >Backend {{ backendMetaService.backendVersion() }}</span
      >
    }
  </div>
</main>
