<div #tableWrapper id="tableWrapper" class="table-wrapper">
  @if (tableDataSource.data.length > 0) {
    <table
      mat-table
      matSort
      [dataSource]="tableDataSource"
      (contentChanged)="contentChanged()"
    >
      <ng-container matColumnDef="primary">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="name">
          {{ fieldLabels.name }}
        </th>
        <td mat-cell *matCellDef="let foodstuff">
          <app-foodstuff-display [foodstuff]="foodstuff" [showBrand]="true" />
        </td>
      </ng-container>
      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let foodstuff">
          <button
            mat-icon-button
            class="button"
            (click)="openEditFoodstuffDialog(foodstuff)"
          >
            <mat-icon
              aria-hidden="false"
              aria-label="Bearbeiten"
              fontIcon="edit"
            />
          </button>
        </td>
      </ng-container>
      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let foodstuff">
          @if (foodstuff.recipeVersionIds.length === 0) {
            <button
              mat-icon-button
              color="warn"
              class="button"
              (click)="openDeleteFoodstuffDialog(foodstuff)"
            >
              <mat-icon
                aria-hidden="false"
                aria-label="Löschen"
                fontIcon="delete"
              />
            </button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <div class="spacer"></div>
    <mat-paginator [hidePageSize]="true" [showFirstLastButtons]="false" />
  } @else {
    <div class="no-foodstuffs-placeholder">
      @if (foodstuffTableControlService.searchBy().length > 0) {
        <p>Keine passenden Lebensmittel gefunden.</p>
        <button mat-button (click)="foodstuffTableControlService.clearSearch()">
          Suche zurücksetzen
        </button>
      } @else {
        <p>Keine Lebensmittel vorhanden.</p>
      }
    </div>
  }
</div>
