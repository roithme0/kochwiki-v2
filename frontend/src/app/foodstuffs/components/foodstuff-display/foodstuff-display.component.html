<app-display-image [src]="imageUrl()" [placeholder]="placeholder" />
<div class="foodstuff-label">
  <div class="foodstuff-primary">
    <span class="foodstuff-name">{{ foodstuff().name }}</span>
    @if (foodstuff().details) {
      <span class="foodstuff-details">{{ foodstuff().details }}</span>
    }
  </div>
  @if (showBrand() && foodstuff().brand) {
    <span class="foodstuff-brand">{{ foodstuff().brand }}</span>
  }
</div>
