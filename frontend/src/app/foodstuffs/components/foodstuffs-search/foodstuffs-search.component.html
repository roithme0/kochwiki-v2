<form class="form">
  <mat-form-field
    class="search-field"
    appearance="outline"
    subscriptSizing="dynamic"
  >
    <mat-icon matPrefix class="search-icon" fontIcon="search" />
    <input
      #searchValueField
      [value]="searchValue()"
      (input)="searchValueChange.emit(searchValueField.value)"
      placeholder="Name oder Marke suchen …"
      aria-label="Name oder Marke suchen"
      matInput
      [matAutocomplete]="search"
    />
    @if (searchValue() != "") {
      <button
        mat-icon-button
        matSuffix
        class="clear-button"
        type="button"
        aria-label="Suche löschen"
        (click)="searchValueChange.emit('')"
      >
        <mat-icon fontIcon="clear" />
      </button>
    }
    <mat-autocomplete
      #search="matAutocomplete"
      (optionSelected)="searchValueChange.emit($event.option.value)"
    >
      @if (filteredNames().size > 0) {
        <mat-optgroup label="Namen">
          @for (name of filteredNames(); track name) {
            <mat-option [value]="name">{{ name }}</mat-option>
          }
        </mat-optgroup>
      }
      @if (filteredBrands().size > 0) {
        <mat-optgroup label="Marken">
          @for (brand of filteredBrands(); track brand) {
            <mat-option [value]="brand">{{ brand }}</mat-option>
          }
        </mat-optgroup>
      }
    </mat-autocomplete>
  </mat-form-field>
</form>
