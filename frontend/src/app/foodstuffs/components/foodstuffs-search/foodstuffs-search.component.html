<form class="form">
  <mat-form-field
    class="search-field"
    appearance="outline"
    subscriptSizing="dynamic"
  >
    <mat-icon matPrefix class="search-icon" fontIcon="search" />
    <input
      #searchValueField
      [value]="searchValue()"
      (input)="searchValueChange.emit(searchValueField.value)"
      placeholder="Name oder Marke suchen …"
      aria-label="Name oder Marke suchen"
      matInput
      autocomplete="off"
    />
    @if (searchValue() != "") {
      <button
        mat-icon-button
        matSuffix
        class="clear-button"
        type="button"
        aria-label="Suche zurücksetzen"
        (click)="searchValueChange.emit('')"
      >
        <mat-icon fontIcon="clear" />
      </button>
    }
  </mat-form-field>
</form>
