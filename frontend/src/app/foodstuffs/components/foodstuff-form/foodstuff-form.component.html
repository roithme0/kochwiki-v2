<form [formGroup]="form" (ngSubmit)="onSubmit()" [attr.aria-busy]="busy()">
  <mat-card>
    <mat-card-header
      ><mat-card-title><h3>Basisdaten</h3></mat-card-title></mat-card-header
    >
    <mat-card-content class="fields">
      <div class="required-fields">
        <mat-form-field
          appearance="outline"
          floatLabel="always"
          class="name-field"
        >
          <mat-label>{{ fieldLabels.name }}</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>
        <mat-form-field
          appearance="outline"
          floatLabel="always"
          class="unit-select"
        >
          <mat-label>{{ fieldLabels.unit }}</mat-label>
          <mat-select formControlName="unit">
            @for (choice of unitChoices; track choice.value) {
              <mat-option [value]="choice.value">{{ choice.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <mat-form-field appearance="outline" floatLabel="always">
        <mat-label>{{ fieldLabels.brand }}</mat-label>
        <input matInput formControlName="brand" />
      </mat-form-field>
      <app-image-editor
        [state]="image"
        [square]="true"
        [placeholder]="imagePlaceholder"
      />
    </mat-card-content>
  </mat-card>
  <mat-card>
    <mat-card-header
      ><mat-card-title><h3>Nährwerte</h3></mat-card-title></mat-card-header
    >
    <mat-card-content class="nutrition-wrapper">
      <div class="macro-editor">
        <div class="chart-editor">
          <app-macro-chart
            class="macro-chart"
            [nutrition]="nutrition()"
            [showKcal]="false"
            role="img"
            aria-label="Makronährstoffverteilung"
          />
          <mat-form-field
            class="calories-field"
            appearance="outline"
            subscriptSizing="dynamic"
          >
            <input
              matInput
              type="number"
              step="any"
              formControlName="kcal"
              [attr.aria-label]="fieldLabels.kcal"
            />
            <span matTextSuffix>kcal</span>
          </mat-form-field>
        </div>
        <div class="macros-wrapper">
          @for (macro of macroKeys; track macro) {
            <app-foodstuff-nutrition-row
              [label]="fieldLabels[macro]"
              [control]="form.controls[macro]"
              [color]="legend()[macro].color"
            />
          }
        </div>
      </div>
      <hr class="nutrition-separator" />
      <app-foodstuff-nutrition-row
        class="fiber-field"
        [label]="fieldLabels.fiber"
        [control]="form.controls.fiber"
      />
    </mat-card-content>
  </mat-card>
  @if (busy() && !image.uploadingImage()) {
    <p role="status">Lebensmittel wird gespeichert …</p>
  }
  <button
    mat-flat-button
    type="submit"
    color="primary"
    [disabled]="form.invalid || busy() || image.invalidImageSelection()"
  >
    <mat-icon aria-hidden="true" fontIcon="save" />
    {{ submitLabel() }}
  </button>
</form>
