<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="fields">
    <div class="required-fields">
      <mat-form-field
        appearance="outline"
        floatLabel="always"
        class="name-field"
      >
        <mat-label>{{ fieldLabels.name }}</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        floatLabel="always"
        class="unit-select"
      >
        <mat-label>{{ fieldLabels.unit }}</mat-label>
        <mat-select formControlName="unit">
          @for (choice of unitChoices; track choice.value) {
            <mat-option [value]="choice.value">{{ choice.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" floatLabel="always">
      <mat-label>{{ fieldLabels.brand }}</mat-label>
      <input matInput formControlName="brand" />
    </mat-form-field>
    <div class="nutrition-wrapper">
      <mat-form-field appearance="outline" floatLabel="always">
        <mat-label>{{ fieldLabels.kcal }}</mat-label>
        <input matInput type="number" formControlName="kcal" />
        <span matTextSuffix>kcal</span>
      </mat-form-field>
      <div class="macros-wrapper">
        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>{{ fieldLabels.carbs }}</mat-label>
          <input matInput type="number" formControlName="carbs" />
          <span matTextSuffix>g</span>
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>{{ fieldLabels.protein }}</mat-label>
          <input matInput type="number" formControlName="protein" />
          <span matTextSuffix>g</span>
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label>{{ fieldLabels.fat }}</mat-label>
          <input matInput type="number" formControlName="fat" />
          <span matTextSuffix>g</span>
        </mat-form-field>
      </div>
    </div>
  </div>
  <button
    mat-flat-button
    type="submit"
    color="primary"
    [disabled]="form.invalid"
  >
    <mat-icon aria-hidden="true" fontIcon="save" />
    {{ submitLabel() }}
  </button>
</form>
