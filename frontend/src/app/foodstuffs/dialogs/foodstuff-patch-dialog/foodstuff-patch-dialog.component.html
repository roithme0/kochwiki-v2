<app-dialog-header
  title="Lebensmittel bearbeiten"
  [showCloseButon]="true"
  [closeDisabled]="busy()"
/>

<mat-dialog-content>
  @if (foodstuff(); as loaded) {
    <app-foodstuff-form
      [foodstuff]="loaded"
      [submitting]="submitting()"
      (uploadingChanged)="onUploadingChange($event)"
      submitLabel="Speichern"
      (submitted)="onSubmit($event)"
    />
  } @else if (loadFailed()) {
    <p role="alert">Lebensmittel konnte nicht geladen werden.</p>
  } @else {
    <p role="status">Lebensmittel wird geladen …</p>
  }
</mat-dialog-content>
