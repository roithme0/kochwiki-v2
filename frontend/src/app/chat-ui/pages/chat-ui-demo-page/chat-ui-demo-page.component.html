<main class="chat-ui-integration">
  <ng-template aiChatDemoRenderer #demoRenderer="aiChatDemoRenderer" let-artifact>
    <article class="demo-recipe">
      <h3>{{ artifact.payload.name }}</h3>
      <p>{{ artifact.payload.description }}</p>
    </article>
  </ng-template>

  <ai-chat-ui
    bannerTitle="Chat-UI Integration"
    bannerDescription="Diese statische Demo zeigt die gemeinsame UI-Bibliothek im Kochwiki-Design mit einer Vorschau aus Kochwiki."
    [artifact]="demoArtifact"
    [renderer]="demoRenderer.template"
  />
</main>
