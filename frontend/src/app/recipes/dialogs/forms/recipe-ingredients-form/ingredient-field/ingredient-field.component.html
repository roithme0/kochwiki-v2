<div class="ingredient-fields">
  <app-foodstuff-display
    [showBrand]="true"
    [foodstuff]="
      foodstuff() ?? {
        name: 'Lebensmittel nicht verfügbar',
        imageId: null,
        details: null,
      }
    "
  />
  <mat-form-field
    appearance="outline"
    floatLabel="always"
    subscriptSizing="dynamic"
    class="amount-field"
  >
    <mat-label>Menge</mat-label>
    <input
      matInput
      type="number"
      [formControl]="amountControl()"
      [attr.aria-label]="
        'Menge für ' +
        (foodstuff()?.name ?? 'Zutat ' + (index() + 1)) +
        (foodstuff()?.details ? ', ' + foodstuff()?.details : '')
      "
    />
    <span matTextSuffix>{{ foodstuff()?.unitVerbose }}</span>
  </mat-form-field>
</div>
