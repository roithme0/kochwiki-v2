<div class="ingredient-fields">
  <app-foodstuff-image
    class="foodstuff-image"
    [imageId]="foodstuff()?.imageId ?? null"
  />
  <div class="foodstuff-label">
    <span>{{ foodstuff()?.name ?? 'Lebensmittel nicht verfügbar' }}</span>
    @if (foodstuff()?.brand) {
      <span class="foodstuff-brand">{{ foodstuff()?.brand }}</span>
    }
  </div>
  <mat-form-field
    appearance="outline"
    floatLabel="always"
    subscriptSizing="dynamic"
    class="amount-field"
  >
    <mat-label>Menge</mat-label>
    <input
      matInput
      type="number"
      [formControl]="amountControl()"
      [attr.aria-label]="
        'Menge für ' + (foodstuff()?.name ?? 'Zutat ' + (index() + 1))
      "
    />
    <span matTextSuffix>{{ foodstuff()?.unitVerbose }}</span>
  </mat-form-field>
</div>
