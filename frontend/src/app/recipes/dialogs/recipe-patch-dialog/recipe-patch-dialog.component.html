<app-dialog-header
  [title]="
    data.recipeVersion.state === 'draft'
      ? 'Entwurf bearbeiten'
      : 'Rezept bearbeiten'
  "
  [showCloseButon]="true"
  [closeDisabled]="busy()"
/>

<mat-dialog-content class="mat-dialog-content">
  <app-recipe-editor
    [recipeLineageId]="data.recipeVersion.recipeLineageId"
    [recipeVersionId]="
      data.recipeVersion.state === 'draft'
        ? data.recipeVersion.recipeVersionId
        : null
    "
    [mode]="data.recipeVersion.state === 'draft' ? 'draft' : 'active'"
    [submitting]="isSubmitting()"
    (uploadingChanged)="onUploadingChange($event)"
    (submitted)="onSubmit($event)"
  />
</mat-dialog-content>
