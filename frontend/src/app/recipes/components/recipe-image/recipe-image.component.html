<div
  class="image-area"
  [class.natural-height]="naturalHeight()"
  [style.aspect-ratio]="naturalHeight() ? aspectRatio() : null"
  [attr.aria-busy]="loading()"
>
  @if (imageUrl(); as url) {
    @for (attempt of [generation()]; track attempt) {
      <img
        [src]="url"
        [attr.width]="dimensions()?.width"
        [attr.height]="dimensions()?.height"
        [style.visibility]="loading() ? 'hidden' : 'visible'"
        alt="Rezeptbild"
        (load)="imageLoaded(url, attempt)"
        (error)="imageLoadFailed(url, attempt)"
      />
    }
  }
  @if (!imageUrl() || loading()) {
    <img
      [src]="placeholder"
      [attr.width]="placeholderDimensions.width"
      [attr.height]="placeholderDimensions.height"
      alt="Platzhalter: leerer Teller"
    />
  }
  @if (failed()) {
    <span class="cdk-visually-hidden" role="status"
      >Rezeptbild konnte nicht geladen werden.</span
    >
    <button
      mat-icon-button
      class="reload-button"
      type="button"
      aria-label="Bild erneut laden"
      matTooltip="Bild erneut laden"
      (click)="$event.preventDefault(); $event.stopPropagation(); retry()"
    >
      <mat-icon aria-hidden="true" fontIcon="refresh" />
    </button>
  }
</div>
