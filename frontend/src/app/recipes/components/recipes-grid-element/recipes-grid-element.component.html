<mat-card>
  <mat-card-content>
    <app-display-image
      alt="Rezeptbild"
      [placeholder]="placeholder"
      [src]="imageUrl()"
      [dimensions]="recipeVersion().imageDimensions"
      [style.aspect-ratio]="aspectRatio()"
    />
    <app-recipe-version-state-badge
      class="version-state-badge"
      [state]="recipeVersion().state"
    />
  </mat-card-content>

  <mat-card-header>
    <mat-card-title>
      {{ recipeVersion().name }}
    </mat-card-title>

    <!-- preptime -->
    @if (
      recipeVersion().preptime !== null &&
      recipeVersion().preptime !== undefined
    ) {
      <mat-card-subtitle>{{ recipeVersion().preptime }} min</mat-card-subtitle>
    }

    <!-- no preptime -->
    @else {
      <mat-card-subtitle style="visibility: hidden">? min</mat-card-subtitle>
    }
  </mat-card-header>
</mat-card>
