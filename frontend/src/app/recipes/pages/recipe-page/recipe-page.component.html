<main>
  @if (recipeVersionIsLoading()) {
    <div class="spinner-wrapper">
      <mat-spinner diameter="25" />
    </div>
  } @else {
    @if (recipeVersion; as recipeVersion) {
      <article>
        <app-recipe-version-state-badge
          class="version-state-badge"
          [state]="recipeVersion.state"
        />
        <app-display-image
          alt="Rezeptbild"
          [placeholder]="placeholder"
          [src]="
            recipeVersion.imageId === null
              ? null
              : images.contentUrl(recipeVersion.imageId)
          "
          [dimensions]="recipeVersion.imageDimensions"
        />
        <app-recipe-presentation
          [recipe]="recipeVersion"
          [interactiveIngredients]="true"
          (ingredientActivated)="openIngredient($event)"
        />
        <div class="spacer"></div>
      </article>

      <app-floating-actions
        [actions]="floatingActions()"
        (activated)="activateFloatingAction($event)"
      />
    } @else {
      <div class="recipe-not-found-placeholder">
        <p>Rezept nicht gefunden.</p>
        <button mat-button (click)="router.navigate(['recipes'])">
          Alle Rezepte anzeigen
        </button>
      </div>
    }
  }
</main>
