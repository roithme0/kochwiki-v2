name: Build and publish app

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  check-contract-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Test contract build tooling
        run: python -m unittest discover -s backend/contract/tools

      - name: Build versioned contract wheel
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0' }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python backend/contract/tools/build_release.py --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --repository "$SOURCE_REPOSITORY" --output "$RUNNER_TEMP/contract-wheel"

      - name: Verify installed wheel on supported Pydantic versions
        run: |
          python -m venv "$RUNNER_TEMP/contract-venv"
          python backend/contract/tools/pydantic_test_constraints.py > "$RUNNER_TEMP/pydantic-constraints"
          while IFS= read -r pydantic; do
            "$RUNNER_TEMP/contract-venv/bin/python" -m pip install --upgrade "$RUNNER_TEMP"/contract-wheel/*.whl "$pydantic"
            "$RUNNER_TEMP/contract-venv/bin/python" -I -m unittest discover -s backend/contract/tests
          done < "$RUNNER_TEMP/pydantic-constraints"

      - name: Preserve verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: contract-release
          path: ${{ runner.temp }}/contract-wheel/*
          if-no-files-found: error

  check-kochwiki-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend contract dependencies
        run: python -m pip install -r ../backend/requirements.txt ../backend/contract

      - name: Install frontend dependencies
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Check generated Kochwiki contract
        run: npm run check:kochwiki-contract

  build-and-publish:
    needs: [check-kochwiki-contract, check-contract-wheel]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/kochwiki-v2-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ''
          - name: frontend
            image: roithme0/kochwiki-v2-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: CONFIGURATION=production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.release.outputs.channel }},enable=${{ github.event_name == 'push' }}


      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            ${{ matrix.build_args }}
            VERSION=${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish-contract:
    if: github.event_name == 'push'
    needs: [check-contract-wheel, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: contract-release
          path: contract-release

      - name: Publish contract assets on app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd contract-release
          sha256sum --check SHA256SUMS
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            flags=()
            if [[ "$RELEASE_TAG" == *-alpha* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.whl SHA256SUMS contract-provenance.json
