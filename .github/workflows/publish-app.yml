name: Build and publish app

on:
  pull_request:
  push:
    tags:

      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  check-kochwiki-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: python -m pip install -r ../backend/requirements.txt

      - name: Install frontend dependencies
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Check generated Kochwiki contract
        run: npm run check:kochwiki-contract

      - name: Lint frontend
        run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend tooling tests
        run: npm run test:tooling

      - name: Run frontend unit tests
        run: npm run test -- --watch=false

  e2e:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - name: Read identity-provider revision
        id: identity-provider
        run: echo "revision=$(cat deployment/tests/identity-provider.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out shared identity-provider configuration
        uses: actions/checkout@v6
        with:
          repository: roithme0/identity-provider
          ref: ${{ steps.identity-provider.outputs.revision }}
          path: .e2e-identity-provider
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Provide private package build secret
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$NPM_TOKEN" > frontend/.npm-token

      - name: Run isolated E2E
        run: node .agents/validation/e2e.mts
        env:
          IDENTITY_PROVIDER_REPOSITORY: ${{ github.workspace }}/.e2e-identity-provider

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-diagnostics
          path: |
            .agents/.codex-validation/e2e/manual/*.log
            frontend/e2e/test-results/
          include-hidden-files: true
          retention-days: 7

  build-and-publish:
    needs: [check-kochwiki-contract, frontend-tests, e2e]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/kochwiki-v2-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ''
          - name: frontend
            image: roithme0/kochwiki-v2-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: CONFIGURATION=production

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.release.outputs.channel }},enable=${{ github.event_name == 'push' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            ${{ matrix.build_args }}
            VERSION=${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
