name: Build and publish app

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

jobs:
  check-kochwiki-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: python -m pip install -r ../backend/requirements.txt

      - name: Install frontend dependencies
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Check generated Kochwiki contract
        run: npm run check:kochwiki-contract

      - name: Lint frontend
        run: npm run lint

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend tooling tests
        run: npm run test:tooling

      - name: Run frontend unit tests
        run: node ../.agents/validation/test.mts --group frontend-app

      - name: Install Chromium for browser component tests
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser component tests
        run: node ../.agents/validation/test.mts --group frontend-browser

      - name: Upload browser component failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-component-diagnostics
          path: frontend/test-results/browser/
          include-hidden-files: true
          retention-days: 7

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Start dedicated test database
        run: docker compose -f deployment/tests/docker-compose-test.yml up -d --wait db
      - name: Run backend tests
        run: node .agents/validation/test.mts --group tooling-backend --group backend

  build-app:
    needs: [check-kochwiki-contract, frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/kochwiki-v2-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ''
          - name: frontend
            image: roithme0/kochwiki-v2-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: CONFIGURATION=production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.event_name == 'push'
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const match = /^v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(-alpha(?:\.(?:0|[1-9]\d*))?)?)$/.exec(process.env.RELEASE_TAG ?? '');
          if (!match) {
            throw new Error('Expected v1.2.0, v1.2.0-alpha, or v1.2.0-alpha.123 (no leading zeros).');
          }
          const channel = match[2] ? 'alpha' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${match[1]}\nchannel=${channel}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ steps.release.outputs.channel }},enable=${{ github.event_name == 'push' }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            ${{ matrix.build_args }}
            VERSION=${{ github.event_name == 'push' && github.ref_name || '0.0.0' }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/app-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Upload built image
        uses: actions/upload-artifact@v6
        with:
          name: app-image-${{ matrix.name }}
          path: ${{ runner.temp }}/app-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build-app
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read identity-provider revision
        id: identity-provider
        run: echo "revision=$(cat deployment/tests/identity-provider.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out shared identity-provider configuration
        uses: actions/checkout@v6
        with:
          repository: roithme0/identity-provider
          ref: ${{ steps.identity-provider.outputs.revision }}
          path: .e2e-identity-provider
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Download built images
        uses: actions/download-artifact@v8
        with:
          pattern: app-image-*
          path: ${{ runner.temp }}/app-images

      - name: Load built images into Docker
        env:
          IMAGE_DIRECTORY: ${{ runner.temp }}/app-images
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo jq
          for name in backend frontend; do
            archive="$IMAGE_DIRECTORY/app-image-$name/app-image.tar"
            reference=$(tar -xOf "$archive" index.json | jq -er '.manifests[0].annotations["org.opencontainers.image.ref.name"]')
            skopeo copy "oci-archive:$archive:$reference" "docker-daemon:kochwiki-v2-$name:e2e"
          done

      - name: Run isolated E2E
        run: node .agents/validation/test.mts --group e2e --prebuilt-images
        env:
          IDENTITY_PROVIDER_REPOSITORY: ${{ github.workspace }}/.e2e-identity-provider

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-diagnostics
          path: |
            .agents/.codex-validation/e2e/
            frontend/e2e/test-results/
            frontend/playwright-report/
          include-hidden-files: true
          retention-days: 7

  publish-app:
    needs: [build-app, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            image: roithme0/kochwiki-v2-backend
          - name: frontend
            image: roithme0/kochwiki-v2-frontend
    env:
      APP_IMAGE: ${{ matrix.image }}
      RELEASE_VERSION: ${{ needs.build-app.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.build-app.outputs.channel }}
    steps:
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: app-image-${{ matrix.name }}
          path: ${{ runner.temp }}

      - name: Install registry client
        uses: regclient/actions/regctl-installer@v0.1.0
        with:
          release: v0.9.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish built image
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/app-image.tar
        run: |
          regctl image import "$APP_IMAGE:$RELEASE_VERSION" "$IMAGE_ARCHIVE"
          regctl image copy "$APP_IMAGE:$RELEASE_VERSION" "$APP_IMAGE:$RELEASE_CHANNEL"
