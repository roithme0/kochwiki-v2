name: kochwiki-v2-local

services:
  file-storage:
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta

  db:
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./postgres/init-kochwiki.sh:/docker-entrypoint-initdb.d/10-kochwiki.sh:ro

  backend:
    build:
      context: "../backend"
    environment:
      DEPLOYMENT_ENVIRONMENT_NAME: ${DEPLOYMENT_ENVIRONMENT_NAME:-local}
      STORAGE_PUBLIC_ORIGIN: ${STORAGE_PUBLIC_ORIGIN:-http://localhost:${GATEWAY_PORT:-8000}}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*,backend,backend:*,host.docker.internal}

  frontend:
    build:
      context: "../frontend"
      dockerfile: Dockerfile
      args:
        CONFIGURATION: local
      secrets:
        - npm_token

volumes:
  postgresql-data:
  garage-data:
  garage-meta:

secrets:
  npm_token:
    file: ../frontend/.npm-token
