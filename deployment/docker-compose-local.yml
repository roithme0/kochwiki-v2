name: kochwiki-v2-local

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kochwiki
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d kochwiki"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  backend:
    build:
      context: "../backend"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@db:5432/kochwiki
      CORS_ORIGINS: http://localhost:8000,http://localhost:4200

  frontend:
    build:
      context: "../frontend"
      dockerfile: Dockerfile
      args:
        CONFIGURATION: local
      secrets:
        - npm_token
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgresql-data:

secrets:
  npm_token:
    file: ../frontend/.npm-token
