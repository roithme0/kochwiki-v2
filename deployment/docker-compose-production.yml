name: kochwiki-v2-production

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-kochwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}
      APP_DB_USER: ${APP_DB_USER:-kochwiki}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deployment/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$APP_DB_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
      - ./postgres/init-kochwiki.sh:/docker-entrypoint-initdb.d/10-kochwiki.sh:ro

  backend:
    image: roithme0/kochwiki-v2-backend:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-kochwiki}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deployment/.env}@db:5432/${APP_DB_NAME:-kochwiki}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*,[::1],[::1]:*,backend,backend:*}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: roithme0/kochwiki-v2-frontend:latest
    depends_on:
      - backend

  gateway:
    image: nginx:1.25
    environment:
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
    entrypoint: ["/bin/sh", "-c", "sh /etc/nginx/configure-ai-gateway.sh && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/kochwiki-gateway.conf.template:ro
      - ./gateway/configure-ai-gateway.sh:/etc/nginx/configure-ai-gateway.sh:ro
    depends_on:
      - backend
      - frontend
