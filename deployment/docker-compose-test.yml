name: kochwiki-v2-test

services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: kochwiki_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d kochwiki_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-tests:
    build:
      context: "../backend"
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@db:5432/kochwiki_test
    depends_on:
      db:
        condition: service_healthy
    command: pytest
