map $request_uri $storage_uri {
    ~^/storage(/.*)$ $1;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $ai_gateway "${AI_GATEWAY_ORIGIN}";
    set $ai_enabled ${AI_GATEWAY_ENABLED};

    location = /storage { return 404; }
    location ^~ /storage/ {
        access_log off;
        error_log /dev/stderr crit;
        client_max_body_size 16m;
        proxy_pass http://file-storage:3900$storage_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }

    location ~ ^/ai/api/v1/agents/[A-Za-z0-9_-]+/sessions(?:/[A-Za-z0-9_-]+(?:/(?:turns|events))?)?$ {
        if ($ai_enabled = 0) { return 503; }
        if ($request_uri !~ "^/ai/api/v1/agents/[A-Za-z0-9_-]+/sessions(?:/[A-Za-z0-9_-]+(?:/(?:turns|events))?)?(?:\?.*)?$") { return 404; }
        rewrite ^/ai(/.*)$ $1 break;
        proxy_pass $ai_gateway$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
    }

    location = /ai { return 404; }
    location /ai/ { return 404; }

    location = /mcp { rewrite ^ /mcp/ last; }
    location /mcp/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_next_upstream off;
    }

    location = /api/mcp { return 404; }
    location /api/mcp/ { return 404; }

    location ^~ /api/auth/ {
        access_log off;
        proxy_pass http://backend:8080/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
