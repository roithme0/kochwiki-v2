server {
    listen 80;
    listen 8080;
    location ~ ^/(recipe|foodstuff)-images/[^/]+/content$ {
        add_header X-Accel-Redirect $http_x_test_handoff;
        add_header Vary "Cookie";
        return 200;
    }
    location = /mcp/ {
        default_type application/json;
        return 200 '{"method":"$request_method","path":"$request_uri","port":"$server_port"}';
    }
    location / { default_type application/json; return 200 '{"ordinary":"available"}'; }
}
